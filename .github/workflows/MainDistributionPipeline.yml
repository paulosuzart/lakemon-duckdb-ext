#
# Expensive DuckDB multi-platform extension binaries.
# Does not run on ordinary feature-branch pushes.
#
# Versions and triggers:
#   - DuckDB 1.5.5 + 2.0.0: every run (push to main, v* tags, workflow_dispatch)
#   - DuckDB 1.5.3 + 1.5.6: v* tags and workflow_dispatch only
#     (not on push to main — those two extra matrices are for GitHub Release binaries)
#
# Artifacts land on the workflow run as:
#   lakemon-<duckdb_version>-extension-<arch>
# After a v* tag build, attach those artifacts to a GitHub Release from that tag.
# This workflow does not create the Git tag or the GitHub Release.
#
# Run the full matrix (including 1.5.3 / 1.5.6) before cutting a release:
#   GitHub → Actions → "Main Extension Distribution Pipeline" → Run workflow
#   (select the branch). Also runs automatically on push to main (1.5.5 + 2.0.0)
#   unless the commit only changes markdown/docs, and on v* tags (all four
#   versions). Path filters apply to branch pushes only, not to v* tags or
#   workflow_dispatch. pull_request runs 1.5.5 + 2.0.0 when extension_config,
#   vcpkg.json, or this workflow change (so a leaked extra extension is caught
#   before merge).
#
name: Main Extension Distribution Pipeline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extension_config.cmake'
      - 'vcpkg.json'
      - '.github/workflows/MainDistributionPipeline.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (DuckDB 1.5.5)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: lakemon

  duckdb-1-5-3-build:
    name: Build extension binaries (DuckDB 1.5.3)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.3
    with:
      duckdb_version: v1.5.3
      ci_tools_version: v1.5.3
      extension_name: lakemon

  duckdb-1-5-6-build:
    name: Build extension binaries (DuckDB 1.5.6)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: lakemon

  duckdb-2-build:
    name: Build extension binaries (DuckDB 2.0.0)
    # extension-ci-tools has no v2.0.0 tag; v2.0-cyanoptera is the 2.0 line.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: lakemon
