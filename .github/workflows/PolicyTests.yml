#
# Cheap, no-DuckDB checks. Runs on every push and pull_request together
# with PostgresLake.yml (real execute on a Postgres DuckLake catalog).
# Full DuckDB distribution builds live in MainDistributionPipeline.yml:
# 1.5.5 + 2.x on push to main / v* tags / workflow_dispatch; extra 1.5.3
# + 1.5.6 binaries only on v* tags or workflow_dispatch.
#
name: Policy tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy tests (no DuckDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run policy tests
        shell: bash
        run: make policy-test
