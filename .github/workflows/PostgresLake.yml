#
# Real execute against a Postgres DuckLake catalog.
# Runs on every pull_request and push so the PR check can go green.
# DuckDB 1.5.5 and 2.x, linux_amd64 only (not the distribution matrix).
#
name: Postgres lake execute
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}
  cancel-in-progress: true

jobs:
  postgres-lake:
    name: Postgres DuckLake execute (${{ matrix.duckdb_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # vcpkg pins match extension-ci-tools for that DuckDB line.
          # 1.5.5: 2025.12.12. 2.x: 2026.06.24 (has roaring 4.7.1 / zlib 1.3.2).
          - duckdb_version: v1.5.5
            ci_tools_version: v1.5.5
            vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
          - duckdb_version: v2.0-cyanoptera
            ci_tools_version: main
            vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lakemon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lakemon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LAKEMON_CI_POSTGRES: "1"
      LAKEMON_PG: dbname=lakemon host=127.0.0.1 port=5432 user=postgres password=postgres
      GEN: ninja
      DISABLE_SANITIZER: "1"
      BUILD_EXTENSION_TEST_DEPS: none
      CORE_EXTENSIONS: parquet
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-linux
      USE_MERGED_VCPKG_MANIFEST: "1"
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
      VCPKG_BINARY_SOURCES: clear;http,https://vcpkg-cache.duckdb.org,read
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libpq-dev

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: postgres-lake-${{ matrix.duckdb_version }}-${{ runner.os }}
          max-size: 2G

      - name: Checkout DuckDB ${{ matrix.duckdb_version }}
        run: |
          rm -rf duckdb extension-ci-tools
          git clone --depth 1 --branch "${{ matrix.duckdb_version }}" https://github.com/duckdb/duckdb.git duckdb
          git clone --depth 1 --branch "${{ matrix.ci_tools_version }}" https://github.com/duckdb/extension-ci-tools.git extension-ci-tools

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ matrix.vcpkg_commit }}

      - name: Build lakemon + ducklake + postgres_scanner
        run: make -j"$(nproc)"

      - name: Execute maintain + expire on Postgres catalog
        timeout-minutes: 2
        run: |
          python3 test/run_postgres_lake.py --timeout 90
