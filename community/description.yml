# Copy this file to duckdb/community-extensions as
#   extensions/lakemon/description.yml
# and set repo.ref to a commit SHA of paulosuzart/lakemon-duckdb-ext.
# Official docs: https://duckdb.org/community_extensions/documentation
#
# The repository must be public before the community CI can clone it.

extension:
  name: lakemon
  description: Smart DuckLake table maintain (adaptive rewrite + merge) and catalog-global expire/cleanup
  version: 0.2.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - Paulo Suzart

repo:
  github: paulosuzart/lakemon-duckdb-ext
  # Public docs list only repo.ref. Extra keys are from community-extensions
  # scripts/build.py (DUCKDB_VERSION / DUCKDB_LATEST_STABLE from
  # .github/workflows/build.yml, currently v2.0.0). No ref_stable field.
  #   ref        — SHA for latest stable DuckDB (v2.0.0).
  #   variegata  — optional SHA when DUCKDB_VERSION == 'v1.5.6'; omit to use ref.
  #   andium     — optional SHA for DuckDB v1.4.5.
  #   ref_next   — optional SHA when DUCKDB_VERSION is not latest stable
  #                (upcoming line; build_next.yml is currently disabled).
  # Same source compiles for 1.5.6 and 2.0.0 (lakemon_compat.hpp).
  # Do not set extra SHAs until they exist.
  ref: REPLACE_WITH_COMMIT_SHA
  # variegata: REPLACE_WITH_1_5_6_COMMIT_SHA
  # ref_next: REPLACE_WITH_UPCOMING_DUCKDB_COMMIT_SHA

docs:
  hello_world: |
    INSTALL ducklake;
    LOAD ducklake;
    INSTALL lakemon FROM community;
    LOAD lakemon;

    ATTACH 'ducklake:metadata.ducklake' AS lake (DATA_PATH 'data_files');

    CALL lakemon_table_stats('lake');
    CALL lakemon_maintain('lake');
    CALL lakemon_maintain_global('lake');
    CALL lakemon_policy();

  extended_description: |
    lakemon orchestrates native DuckLake maintenance CALLs with a policy layer:

    * Catalog SELECT inventory of data files, delete files, and inlined-delete backlog
    * Flush guard (lakemon_flush_inlined_max_delete_files) so a large ended-file delete backlog cannot block rewrite/merge
    * Byte-weighted adaptive rewrite ladder (delete fraction DESC; one ducklake_rewrite_data_files CALL per byte-cut rung)
    * Merge size bands (micro / small / medium) with per-tier target_file_size
    * Table maintain (lakemon_maintain) vs catalog-global expire/cleanup (lakemon_maintain_global)
    * CALL / SELECT plan and execute by default (dry_run for plan only)
    * One result row per step (ok / skip / error / planned)
    * Optional stderr step logs with duration and byte-weighted progress

    Requires the core ducklake extension in the same session and an attached DuckLake catalog.
    Compatible with DuckDB 1.5.6 and DuckDB 2.0.0 (lakemon 0.2.0+). Older DuckDB 1.5.x builds are no longer produced.
